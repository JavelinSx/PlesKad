name: Update law changes feed

on:
  schedule:
    - cron: "0 6 1 * *" # 1-го числа каждого месяца в 06:00 UTC (09:00 МСК)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тестовый прогон: проверить поиск + доступ к таблице, без вызова DeepSeek и без записи"
        type: boolean
        default: false

jobs:
  update-laws:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # needed to dispatch deploy.yml below

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install updater dependencies
        working-directory: scripts/laws-updater
        run: npm install

      - name: Run laws updater
        working-directory: scripts/laws-updater
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: node update-laws.mjs

      - name: Commit and push if data/laws.ts changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/laws.ts; then
            echo "No changes to data/laws.ts — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git add data/laws.ts
            git commit -m "chore: monthly law updates refresh"
            # main can move between checkout and push (e.g. someone pushing a
            # code change at the same time) — retry a few times with a rebase
            # instead of failing the whole run over a timing collision.
            pushed=false
            for i in 1 2 3; do
              if git push; then
                pushed=true
                break
              fi
              echo "Push rejected, retrying with rebase ($i/3)..."
              git pull --rebase origin main
            done
            echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN does NOT trigger other
      # workflows (GitHub's anti-recursion rule) — so deploy.yml would
      # otherwise never run after this bot commits new law data. Dispatch it
      # explicitly instead of relying on its `on: push` trigger.
      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
